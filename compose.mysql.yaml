name: h2-asia-moora

services:
  mysql:
    image: mysql:8.4
    container_name: h2-asia-moora-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Isi DB_DATABASE di .env.mysql}
      MYSQL_USER: ${DB_USERNAME:?Isi DB_USERNAME di .env.mysql}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env.mysql}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Isi MYSQL_ROOT_PASSWORD di .env.mysql}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --user=\"$$MYSQL_USER\" --database=\"$$MYSQL_DATABASE\" --execute='SELECT 1' --silent > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql_data:
